# ⚠️ 格式範例（FORMAT SAMPLE）— 不是 IAM 的生產 catalog。
# IAM 本身不持有 catalog（grant/revoke 為 admin-only、不走 context-permission 把關）；
# 這份只示範 PermissionKit 的 split 格式（單一 aggregate context、serverPrefix ""、全 1:1）。
# 權威格式 reference 已內嵌在 /permission-doc skill。
# 驗證：swift run permission-gen --output-dir <dir> permissions/IAMContext.permissions.yaml
context: IAMContext
serverPrefix: ""

# ① catalog：有哪些權限
permissions:
  - slot: EmployeeAccess
    operationId: createUserAccessProfile
    description: 建立員工存取設定檔
  - slot: EmployeeAccess
    operationId: grantPrivilege
    description: 授予權限
  - slot: EmployeeAccess
    operationId: revokePrivilege
    description: 撤銷權限
  - slot: EmployeeAccess
    operationId: assignRoles
    description: 指派角色
  - slot: EmployeeAccess
    operationId: revokeRoles
    description: 撤銷角色
  - slot: EmployeeAccess
    operationId: promoteUser
    description: 晉升使用者
  - slot: EmployeeAccess
    operationId: transferDepartment
    description: 部門調動
  - slot: Query
    operationId: getPermissions
    description: 查詢使用者權限

# ② rules：哪條 route 要哪些權限（requires 用 <slot>.<operationId> 參照 catalog）
rules:
  - method: post
    path: /employee-access/{employeeAccessId}/create-user-access-profile
    requires:
      - EmployeeAccess.createUserAccessProfile
  - method: post
    path: /employee-access/{employeeAccessId}/grant-privilege
    requires:
      - EmployeeAccess.grantPrivilege
  - method: post
    path: /employee-access/{employeeAccessId}/revoke-privilege
    requires:
      - EmployeeAccess.revokePrivilege
  - method: post
    path: /employee-access/{employeeAccessId}/assign-roles
    requires:
      - EmployeeAccess.assignRoles
  - method: post
    path: /employee-access/{employeeAccessId}/revoke-roles
    requires:
      - EmployeeAccess.revokeRoles
  - method: post
    path: /employee-access/{employeeAccessId}/promote-user
    requires:
      - EmployeeAccess.promoteUser
  - method: post
    path: /employee-access/{employeeAccessId}/transfer-department
    requires:
      - EmployeeAccess.transferDepartment
  - method: get
    path: /employee-access/permissions/{userId}
    requires:
      - Query.getPermissions
