# ⚠️ 格式範例（FORMAT SAMPLE）— 不是 IAM 的生產 catalog。
# IAM 本身不持有 catalog（grant/revoke 為 admin-only、不走 context-permission 把關）；
# 這份只示範 PermissionKit 的 split 兩檔格式（catalog 一檔、rules 一檔；單一 aggregate context、serverPrefix ""、全 1:1）。
# 這是 catalog 檔（context + serverPrefix + permissions）；rules 在隔壁 IAMContext.rules.yaml。
# 權威格式 reference 已內嵌在 /permission-doc skill。
# 驗證：swift run permission-gen --permissions permissions/IAMContext.permissions.yaml --rules permissions/IAMContext.rules.yaml --output-dir <dir>
context: IAMContext
serverPrefix: ""

# catalog：有哪些權限（rawValue = IAMContext.<slot>.<Pascal(operationId)>）
permissions:
  - slot: EmployeeAccess
    operationId: createUserAccessProfile
    description: 建立員工存取設定檔
  - slot: EmployeeAccess
    operationId: grantPrivilege
    description: 授予權限
  - slot: EmployeeAccess
    operationId: revokePrivilege
    description: 撤銷權限
  - slot: EmployeeAccess
    operationId: assignRoles
    description: 指派角色
  - slot: EmployeeAccess
    operationId: revokeRoles
    description: 撤銷角色
  - slot: EmployeeAccess
    operationId: promoteUser
    description: 晉升使用者
  - slot: EmployeeAccess
    operationId: transferDepartment
    description: 部門調動
  - slot: Query
    operationId: getPermissions
    description: 查詢使用者權限
