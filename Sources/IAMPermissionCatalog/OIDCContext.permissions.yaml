context: OIDCContext
serverPrefix: /oidc-context

# The admin API's permissions (admin listener, OIDC_ADMIN_HTTP_PORT). The IAMContext repo's catalog must hold a byte-identical
# copy (IAMContext: Sources/IAMPermissionCatalog/OIDCContext.permissions.yaml) before these can be granted. Every route on the admin router
# must have a rule in OIDCContext.rules.yaml (AdminAuthenticationTests.routeTableMatchesTheRouter and
# everyRouteRequiresItsPermission lock this).
permissions:
  # Sign-in clients (/admin/clients).
  - slot: Client
    operationId: viewClients
    description: 查看登入型 client（列表與明細）
  - slot: Client
    operationId: createClient
    description: 建立登入型 client（會產生一次 client secret）；建立時設成受信任或帶授權政策，還需要「修改登入型 client」權限
  - slot: Client
    operationId: updateClient
    description: 修改登入型 client 的名稱、redirect URI、是否受信任；有帶授權政策時整份取代（含登入所需權限，政策裡沒帶就是清除）
  - slot: Client
    operationId: rotateClientSecret
    description: 重新產生登入型 client 的 secret
  - slot: Client
    operationId: deleteClient
    description: 刪除登入型 client
  # Application credentials (/admin/applications), stored in IdentityContext.
  - slot: ApplicationCredential
    operationId: viewApplicationCredentials
    description: 查看系統憑證（列表與明細，不含 secret）
  - slot: ApplicationCredential
    operationId: createApplicationCredential
    description: 建立系統憑證（會產生一次 client secret）
  - slot: ApplicationCredential
    operationId: regenerateApplicationCredentialSecret
    description: 重新產生系統憑證的 secret（舊 secret 立刻失效）
  - slot: ApplicationCredential
    operationId: disableApplicationCredential
    description: 停用系統憑證（已發出的 token 最多再用 15 分鐘）
  - slot: ApplicationCredential
    operationId: enableApplicationCredential
    description: 重新啟用已停用的系統憑證
  - slot: ApplicationCredential
    operationId: changeApplicationCredentialNetworkAccess
    description: 開放或關閉系統憑證的外網使用（開放後，secret 外洩時可以從任何地方換 token）
