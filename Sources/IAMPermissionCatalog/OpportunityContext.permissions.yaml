    operationId: leaveFormMessage
    description: "建立表單層留言串（root message）；aggregate 端只驗白名單身分，「能不能留言」由本條授權決定"
  - slot: Annotating
    operationId: deleteFormThread
    description: "刪除整個表單留言串（含 root message）；限白名單內該串 creator 本人 ∨ 持 `hasFullRights` 者"
  - slot: Annotating
    operationId: leaveMessage
    description: "在指定 highlight 串或表單留言串下留言/回覆；aggregate 端只驗白名單身分，「能不能留言」由本條授權決定；回覆串深上限 2 層"
  - slot: Annotating
    operationId: editMessage
    description: "編輯指定留言內容；僅白名單內作者本人可執行 —— `hasFullRights` 在這裡**刻意不適用**，本文件最大權限只涵蓋刪除，不含改他人文字"
  - slot: Annotating
    operationId: deleteMessage
    description: "刪除指定留言並級聯刪除其子回覆；限白名單內作者本人 ∨ 該串 creator ∨ 持 `hasFullRights` 者；formThread root message 不可用此 operation 刪除（改用 deleteFormThread）"
