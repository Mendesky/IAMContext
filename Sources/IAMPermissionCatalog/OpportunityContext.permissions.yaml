  # ── [data-level] 每個所的「分配權限」（資料層面權限）────────────────────────────
  # 持有 AllocateFor<所> 者 ＝ 該所的分配人員。用於「已建檔」時自動把該所分配人員加入案件檢視者。
  # ⚠️ 這類權限屬「資料層面(data-level)」——決定「看得到哪些資料」，不綁任何 HTTP endpoint（故不列入
  # rules.yaml）。未來正式實作資料層權限機制時，需將這類 data-level 權限與 endpoint-level 權限
  # 獨立劃分處理，勿與 endpoint 權限混用。
  - slot: Handover
    operationId: allocateForMain
    description: "[data-level] 總所(main)分配人員：已建檔時自動成為該所案件檢視者"
  - slot: Handover
    operationId: allocateForTaipei
    description: "[data-level] 台北所(taipei)分配人員：已建檔時自動成為該所案件檢視者"
  - slot: Handover
    operationId: allocateForTaoyuan
    description: "[data-level] 桃園所(taoyuan)分配人員：已建檔時自動成為該所案件檢視者"
  - slot: Handover
    operationId: allocateForTaichung
    description: "[data-level] 台中所(taichung)分配人員：已建檔時自動成為該所案件檢視者"
  - slot: Handover
    operationId: allocateForChanghua
    description: "[data-level] 彰化所(changhua)分配人員：已建檔時自動成為該所案件檢視者"
  - slot: Handover
    operationId: allocateForChiayi
    description: "[data-level] 嘉義所(chiayi)分配人員：已建檔時自動成為該所案件檢視者"
  - slot: Annotating
    operationId: markHighlightByTextQuote
    description: "以 TextQuote selector 在訪談表指定欄位劃記，並原子建立首則留言；aggregate 端只驗白名單身分（`requireMember`），「能不能劃記」就由本條授權決定"
