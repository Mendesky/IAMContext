    description: "由 handoverDocumentId 反查對應的 annotatingId（first-wins）"
  - slot: Annotating
    operationId: getAnnotations
    description: "取得指定訪談表的全部劃記與留言串（依 operator 白名單身分回傳可見範圍），非白名單者一律回 404"
