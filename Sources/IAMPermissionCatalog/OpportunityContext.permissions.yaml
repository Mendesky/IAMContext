context: OpportunityContext
serverPrefix: "/opportunity-context"

permissions:
  - slot: AuditQuoting
    operationId: addAccounting
    description: "新增一筆會計帳務處理作業（accounting）serviceItem；serviceItemId 由後端生成並回傳"
  - slot: AuditQuoting
    operationId: addAccountingReform
    description: "新增一筆會計帳務重整作業（accountingReform）serviceItem；startDate / endDate / providesElectronicFile 均為必填；僅適用於 accountingType = taxAccount"
  - slot: AuditQuoting
    operationId: addAssistanceAnnualSupplementaryPremiumDeductionDetailsReporting
    description: "新增一筆年度補充保費扣費明細彙報附加服務 serviceItem；workItem 固定；建議置於 additional quotingBundle"
  - slot: AuditQuoting
    operationId: addAssistanceCtp
    description: "新增一筆年度 CTP 申報（ctp）附加服務 serviceItem；workItem 固定為 ctp；startDate / endDate 均為選填；quotingBundleType 必須為 additional。行號（獨資合夥）不提供此服務"
  - slot: AuditQuoting
    operationId: addCashierOperation
    description: "新增一筆出納事務處理作業（cashierOperation）serviceItem；workItem 可選 accountsReceivablePayablePostingAndOffsetting 或 onlineBankingPaymentAggregator"
  - slot: AuditQuoting
    operationId: addCustomizedReporting
    description: "在指定 serviceItem 下新增一筆客製化報表（customizedReporting）；僅適用於含 customizedReporting workItem 的 serviceItem；name 不可為空白"
  - slot: AuditQuoting
    operationId: addFinancialComplianceAudit
    description: "新增一筆財務報表查核簽證（financialComplianceAudit）serviceItem；workItem 固定，startDate 為必填"
  - slot: AuditQuoting
    operationId: addPayrollSupportOperation
    description: "新增一筆薪資人力支援作業（payrollSupportOperation）serviceItem；workItem 可選 5 種；含 monthlyPayrollReviewOperation 時須提供 payrollHeadcount（> 0）"
  - slot: AuditQuoting
    operationId: addProvisionalIncomeTaxAudit
    description: "新增一筆暫繳簽證（provisionalIncomeTaxAudit）serviceItem；workItem 固定，startDate（服務年度）為必填；同 bundle 與記帳暫繳申報互斥"
  - slot: AuditQuoting
    operationId: addTaxComplianceAudit
    description: "新增一筆營利事業所得稅查核簽證（taxComplianceAudit）serviceItem — 不含未分配盈餘查核；startDate 為必填"
  - slot: AuditQuoting
    operationId: addTaxComplianceAuditAndUndistributedEarningsAudit
    description: "新增一筆營利事業所得稅查核簽證及未分配盈餘查核 serviceItem — 一般公司型態使用；startDate 為必填"
  - slot: AuditQuoting
    operationId: confirmNoPredecessorAuditor
    description: "確認無前所"
  - slot: AuditQuoting
    operationId: customizeServiceItem
    description: "新增一筆自訂（customized）serviceItem；serviceItemName 為必填且不可為空白字串；startDate 為選填"
  - slot: AuditQuoting
    operationId: deleteCustomizedReporting
    description: "刪除 serviceItem 中指定的客製化報表（customizedReporting）；僅適用於含 customizedReporting workItem 的 serviceItem"
  - slot: AuditQuoting
    operationId: editAccountBalanceDetailReportNeed
    description: "修改 serviceItem 是否需要實科目餘額明細表；僅適用於含 standardReporting workItem 的 serviceItem"
  - slot: AuditQuoting
    operationId: editAccountingReformElectronicFileProvision
    description: "修改 serviceItem 是否提供整帳過程電子檔（providesElectronicFile）；僅適用於 type = accountingReform 的 serviceItem"
  - slot: AuditQuoting
    operationId: editAccountingType
    description: "修改帳務類型"
  - slot: AuditQuoting
    operationId: editBalanceSheetNeed
    description: "修改 serviceItem 是否需要資產負債表；僅適用於含 standardReporting workItem 的 serviceItem"
  - slot: AuditQuoting
    operationId: editBranchCount
    description: "修改分支機構數"
  - slot: AuditQuoting
    operationId: editBusinessTaxFilingMethod
    description: "修改 serviceItem 的營業稅申報方式；僅適用於含 businessTaxFiling workItem 的 serviceItem"
  - slot: AuditQuoting
    operationId: editCommonBankMonthlyRecordCount
    description: "修改 serviceItem 的常用銀行單月資料筆數；僅適用於含 fundingProcess workItem 的 serviceItem，須 >= 0"
  - slot: AuditQuoting
    operationId: editCustomizedReporting
    description: "修改 serviceItem 中指定客製化報表的 name 與 description；僅適用於含 customizedReporting workItem 的 serviceItem"
  - slot: AuditQuoting
    operationId: editDomesticTransferCount
    description: "修改 serviceItem 的國內轉帳次數；僅適用於含 onlineBankingPaymentAggregator workItem 的 serviceItem，須 >= 0"
  - slot: AuditQuoting
    operationId: editEstimatedEvidenceCount
    description: "修改預估憑證週期數量"
  - slot: AuditQuoting
    operationId: editEstimatedHeadcountOfWithholding
    description: "修改預估扣繳人數；省略 estimatedHeadcountOfWithholding 欄位代表清空（設為無值）"
  - slot: AuditQuoting
    operationId: editEstimatedRevenue
    description: "修改預估營業額"
  - slot: AuditQuoting
    operationId: editIncomeStatementNeed
    description: "修改 serviceItem 是否需要損益表；僅適用於含 standardReporting workItem 的 serviceItem"
  - slot: AuditQuoting
    operationId: editIndustrialType
    description: "修改產業別"
  - slot: AuditQuoting
    operationId: editInternationalTransferCount
    description: "修改 serviceItem 的國外轉帳次數；僅適用於含 onlineBankingPaymentAggregator workItem 的 serviceItem，須 >= 0"
  - slot: AuditQuoting
    operationId: editLastYearRevenue
    description: "修改去年營業額"
  - slot: AuditQuoting
    operationId: editPaidInCapital
    description: "修改實收資本額（paidInCapital）。僅適用於有限公司、股份有限公司；獨資合夥改用 editRegisteredCapital。不適用 organizationType 回 422，值為負或 NaN 回 422"
  - slot: AuditQuoting
    operationId: editPayrollHeadcount
    description: "修改 serviceItem 的薪資處理人數（payrollHeadcount）；僅適用於含 monthlyPayrollReviewOperation workItem 的 serviceItem，須 > 0"
  - slot: AuditQuoting
    operationId: editPayrollTransferCount
    description: "修改 serviceItem 的薪資轉帳次數；僅適用於含 onlineBankingPaymentAggregator workItem 的 serviceItem，須 >= 0"
  - slot: AuditQuoting
    operationId: editProfitseekingEnterpriseIncomeTaxFilingMethod
    description: "修改 serviceItem 的營利事業所得稅申報方式；僅適用於含 profitseekingEnterpriseIncomeTaxFiling workItem 的 serviceItem；不可設為 taxComplianceAudit"
  - slot: AuditQuoting
    operationId: editRegisteredCapital
    description: "修改登記資本額（registeredCapital）。僅適用於獨資合夥；有限公司、股份有限公司改用 editPaidInCapital。不適用 organizationType 回 422，值為負或 NaN 回 422"
  - slot: AuditQuoting
    operationId: editSalesEinvoiceUsage
    description: "修改銷項電子發票使用狀態"
  - slot: AuditQuoting
    operationId: editServiceItemEndDate
    description: "修改 serviceItem 的結束日；指定 workItemType 則僅修改該 workItem 的 endDate，未指定則修改 serviceItem 層級 endDate"
  - slot: AuditQuoting
    operationId: editServiceItemStartDate
    description: "修改 serviceItem 的起始日；指定 workItemType 則僅修改該 workItem 的 startDate，未指定則修改 serviceItem 層級 startDate"
  - slot: AuditQuoting
    operationId: editTotalAssets
    description: "修改資產總額"
  - slot: AuditQuoting
    operationId: getEvidenceInfo
    description: "取得憑證資訊"
  - slot: AuditQuoting
    operationId: getOperationInfo
    description: "取得營運資訊"
  - slot: AuditQuoting
    operationId: getPredecessorServiceInfo
    description: "取得前所服務資訊"
  - slot: AuditQuoting
    operationId: getQuotingProofs
    description: "取得報價佐證文件列表"
  - slot: AuditQuoting
    operationId: recordPastCostAnalysisRequirement
    description: "記錄過往成本分析需求"
  - slot: AuditQuoting
    operationId: recordPredecessorAuditorInfo
    description: "記錄前所資訊"
  - slot: AuditQuoting
    operationId: removeQuotingProof
    description: "移除報價佐證文件"
  - slot: AuditQuoting
    operationId: removeServiceItems
    description: "批次移除指定的 serviceItems（以 id 清單指定）；含 taxComplianceAudit 時會觸發營所稅 filingMethod / costAnalysis / pricingDetails 連鎖調整，需以原子批次提交"
  - slot: AuditQuoting
    operationId: selectAccountingWorkItems
    description: "整組替換 accounting serviceItem 的 workItem 選擇與 configs；serviceItem 須存在且 type 為 accounting"
  - slot: AuditQuoting
    operationId: selectCashierOperationWorkItems
    description: "整組替換 cashierOperation serviceItem 的 workItem 選擇與 configs；serviceItem 須存在且 type 為 cashierOperation"
  - slot: AuditQuoting
    operationId: selectPayrollSupportOperationWorkItems
    description: "整組替換 payrollSupportOperation serviceItem 的 workItem 選擇與 configs；serviceItem 須存在且 type 為 payrollSupportOperation"
  - slot: AuditQuoting
    operationId: selectTaxComplianceAuditAndUndistributedEarningsAuditWorkItems
    description: "整組替換 taxComplianceAuditAndUndistributedEarningsAudit serviceItem 的 workItemTypes 與 configs；須含 taxComplianceAudit anchor，startDate 必填"
  - slot: AuditQuoting
    operationId: uploadQuotingProof
    description: "上傳報價佐證文件"
  - slot: CompanyRegistrationQuoting
    operationId: addAssistanceChairmanConvenienceSeal
    description: "新增一筆代刻公司便章（小）附加服務 serviceItem；workItem 固定為 assistanceWithChairmanConvenienceSeal；chairmanConvenienceSealCount 必填且 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: addAssistanceChairmanSeal
    description: "新增一筆代刻公司章（小）附加服務 serviceItem；workItem 固定為 assistanceWithChairmanSeal；chairmanSealCount 必填且 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: addAssistanceCompanyConvenienceSeal
    description: "新增一筆代刻公司便章（大）附加服務 serviceItem；workItem 固定為 assistanceWithCompanyConvenienceSeal；companyConvenienceSealCount 必填且 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: addAssistanceCompanySeal
    description: "新增一筆代刻公司章（大）附加服務 serviceItem；workItem 固定為 assistanceWithCompanySeal；companySealCount 必填且 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: addAssistanceInvoiceSeal
    description: "新增一筆代刻發票章附加服務 serviceItem；workItem 固定為 assistanceWithInvoiceSeal；invoiceSealCount 必填且 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: addAssistanceLaborAndHealthInsuranceInsuredUnitSetting
    description: "新增一筆代辦勞健保投保單位設立附加服務 serviceItem；workItem 固定為 assistanceWithLaborAndHealthInsuranceInsuredUnitSetting"
  - slot: CompanyRegistrationQuoting
    operationId: addAssistanceWithCompanyCertificationApplication
    description: "新增一筆代辦工商憑證申請附加服務 serviceItem；workItem 固定為 assistanceWithCompanyCertificationApplication"
  - slot: CompanyRegistrationQuoting
    operationId: addCompanyRegistration
    description: "新增一筆公司設立（companyRegistration）serviceItem；serviceItemId 由後端生成並回傳。workItems 至少含一項；含 economicMinistryRegistration workItem 時 shareholderCount/isFranchise/region/isProcessedByJW 必填"
  - slot: CompanyRegistrationQuoting
    operationId: addOwnerOccupiedResidencePartForBusinessApplication
    description: "新增一筆自用住宅申請部分供營業用附加服務 serviceItem；workItem 固定為 ownerOccupiedResidencePartForBusinessApplication"
  - slot: CompanyRegistrationQuoting
    operationId: configureEconomicMinistryRegistrationCharged
    description: "以收費模式設定 serviceItem 的 economicMinistryRegistration 相關 configs（region 必填、paymentDisplayType 必填、price 選填）。收費模式下 isProcessedByJW 強制為 true"
  - slot: CompanyRegistrationQuoting
    operationId: configureEconomicMinistryRegistrationNoCharge
    description: "以不收費模式設定 serviceItem 的 economicMinistryRegistration 相關 configs（region + isProcessedByJW）。執行後會移除既有 4 個 EMR configs 再寫入這 2 個"
  - slot: CompanyRegistrationQuoting
    operationId: editChairmanConvenienceSealCount
    description: "編輯代刻公司便章（小）數量。serviceItem 需已含 assistanceWithChairmanConvenienceSeal workItem；chairmanConvenienceSealCount 必須 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: editChairmanSealCount
    description: "編輯代刻公司章（小）數量。serviceItem 需已含 assistanceWithChairmanSeal workItem；chairmanSealCount 必須 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: editCompanyConvenienceSealCount
    description: "編輯代刻公司便章（大）數量。serviceItem 需已含 assistanceWithCompanyConvenienceSeal workItem；companyConvenienceSealCount 必須 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: editCompanySealCount
    description: "編輯代刻公司大章數量。serviceItem 需已含 assistanceWithCompanySeal workItem；companySealCount 必須 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: editInvoiceSealCount
    description: "編輯代刻發票章數量。serviceItem 需已含 assistanceWithInvoiceSeal workItem；invoiceSealCount 必須 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: editIsFranchise
    description: "編輯 serviceItem 的 isFranchise（是否為特許行業）。serviceItem 需已含 economicMinistryRegistration workItem"
  - slot: CompanyRegistrationQuoting
    operationId: editServiceItemStartDate
    description: "編輯 serviceItem 的 startDate config。適用於任意 serviceItem（無 workItemType 限制）"
  - slot: CompanyRegistrationQuoting
    operationId: editShareholderCount
    description: "編輯 serviceItem 的股東人數。serviceItem 需已含 economicMinistryRegistration workItem；shareholderCount 必須 > 0"
  - slot: CompanyRegistrationQuoting
    operationId: removeServiceItems
    description: "批次移除指定的 serviceItems（以 id 清單指定）；被移除的 serviceItem 會連動從 pricingDetails 清除"
  - slot: CompanyRegistrationQuoting
    operationId: selectCompanyRegistrationWorkItems
    description: "重新選擇 companyRegistration serviceItem 的 workItemTypes 與相關 configs。執行後完整替換既有 workItemTypes + configs"
  - slot: OpportunityContext
    operationId: addQuotingCase
    description: "在既有 grouping 加一筆 quotingCase，依 customerEstablishmentStatus discriminator 分流三種情境"
  - slot: OpportunityContext
    operationId: archiveQuotingCaseGrouping
    description: "封存 grouping（這份報價不再進行的決策），cascade lock 下游 aggregate"
  - slot: OpportunityContext
    operationId: cancelQuotingCaseGroupingDealClose
    description: "撤回 grouping 的成交決議，把所有 settled cases 翻回 .opened"
  - slot: OpportunityContext
    operationId: cancelQuotingCaseGroupingHandOver
    description: "撤回 grouping 的完成建檔決議，把所有 .handedOver case 翻回 .delivered"
  - slot: OpportunityContext
    operationId: changeOrganizationType
    description: "變更指定 quotingCase 的組織型態並連動重整資本額（跨 aggregate orchestration）"
  - slot: OpportunityContext
    operationId: closeQuotingCasesDeal
    description: "對 grouping 內所有 quotingCase 一次性結算成交/未成交（α 模型）"
  - slot: OpportunityContext
    operationId: createQuotingCaseGrouping
    description: "建立 QuotingCaseGrouping，依 customerEstablishmentStatus discriminator 分流 established/establishing/unestablished 三種建立情境"
  - slot: OpportunityContext
    operationId: deliverQuotingCase
    description: "把指定 quotingCase 從 .dealClosed 推進到 .delivered（建檔中），並 atomic 更新公司名"
  - slot: OpportunityContext
    operationId: getAccountingSetup
    description: "取得 quotingCase 的帳務設定（accountingType + organizationType）"
  - slot: OpportunityContext
    operationId: getBusinessClientAssistance
    description: "取得 grouping 的「貴公司協助辦理事項」清單（集團或 per-case 模式）"
  - slot: OpportunityContext
    operationId: getCustomerInfo
    description: "取得 quotingCase 的客戶資訊（discriminated union by customerEstablishmentStatus），供編輯客戶資訊 dialog 初始值"
  - slot: OpportunityContext
    operationId: getOrganizationType
    description: "取得 quotingCase 的組織型態"
  - slot: OpportunityContext
    operationId: getPaymentSummary
    description: "取得 quotation 整體酬金總覽，依 quotingCase 結構化（集團或 per-case 模式）"
  - slot: OpportunityContext
    operationId: getQuotationPdfDownload
    description: "下載報價單 PDF binary（content-type application/pdf）"
  - slot: OpportunityContext
    operationId: getQuotationPdfPreview
    description: "取得報價單 PDF 預覽，渲染為 PNG 回 base64 字串陣列（每頁一張）"
  - slot: OpportunityContext
    operationId: getQuotingCaseGroupingAggregateRootIds
    description: "用 groupingId 一次撈齊該 grouping 名下所有 aggregate root id（Quotation/AuditQuoting/CompanyRegistrationQuoting）"
  - slot: OpportunityContext
    operationId: getQuotingCaseGroupingSummaries
    description: "取得 kanban 看板資料 — 該 operator 建立過的所有 quotingCaseGrouping 卡片摘要 list"
  - slot: OpportunityContext
    operationId: getQuotingCaseGroupingUserPermissions
    description: "給 userId + groupingId，回該 user 對該案件的權限（依協作角色 owner/editor/viewer）"
  - slot: OpportunityContext
    operationId: getQuotingCaseGroupingViewMode
    description: "集團總覽檢視 viewModel — 一次回傳整個 grouping 檢視頁所需 sections"
  - slot: OpportunityContext
    operationId: getGroupingAssignmentTimeline
    description: "查詢 grouping 的分配時間軸（送出分配 / 完成案件分配 / 完成案件歸屬 三個時間戳）"
  - slot: OpportunityContext
    operationId: getQuotingCases
    description: "列出 grouping 內所有 quotingCase 的 summary，含 primaryQuotingCaseId 標記"
  - slot: OpportunityContext
    operationId: getQuotingCaseViewMode
    description: "單公司檢視 viewModel — 一次回傳該 case 檢視頁所需 sections"
  - slot: OpportunityContext
    operationId: getServiceItemDetail
    description: "取得單一 serviceItem 的完整參數 View（含 type/isSelected/workItemTypes/configs）"
  - slot: OpportunityContext
    operationId: getServiceItemsByQuotingBundleId
    description: "取得指定 quotingBundle 內的 serviceItem 索引（id/type/parent 關係）+ 定價分組"
  - slot: OpportunityContext
    operationId: getServiceScope
    description: "取得 grouping 的服務範圍 modules（跨 case 聚合 serviceItem）"
  - slot: OpportunityContext
    operationId: getTemplateVariables
    description: "取得指定 grouping 的範本變數表（grouping 級 + 各 case 級）"
  - slot: OpportunityContext
    operationId: handOverQuotingCases
    description: "Grouping-level sweep：把 grouping 內所有 .delivered case 一次推進到 .handedOver（已建檔）"
  - slot: OpportunityContext
    operationId: unarchiveQuotingCaseGrouping
    description: "撤銷封存，解除 grouping 的 archived 狀態並恢復 mutating 能力"
  - slot: OpportunityContext
    operationId: withdrawQuotingCaseAssignment
    description: "退回整案分配：清空 grouping 的 designatedUser / assignedUser / belongedUser，並連動清除該 grouping 下所有 handover 的 assignment"
  - slot: Quotation
    operationId: addContractNoteByUser
    description: "新增 user-added contract note。noteId 由後端產生 UUID 回給前端；非 idempotent"
  - slot: Quotation
    operationId: editContractNote
    description: "編輯既有 contract note 的內文（by-trigger，對應 domain event ContractNoteEdited）"
  - slot: Quotation
    operationId: editFontSize
    description: "編輯 quotation PDF 字級並持久化；preview / download 端會讀取此持久值，fontSize 必須 > 0"
  - slot: Quotation
    operationId: editGroupMergedDisplayName
    description: "設定或清空集團合併報價單的自訂顯示名稱（送 null 清空）；僅集團可設定"
  - slot: Quotation
    operationId: getGroupMergedDisplayName
    description: "取得集團合併報價單的自訂顯示名稱；null 代表未填／已清空，PDF 回退為預設呈現"
  - slot: Quotation
    operationId: editLetterContent
    description: "編輯指定 quotingCase 的 letter 內文覆寫（純文字字串）"
  - slot: Quotation
    operationId: editLetterFrom
    description: "編輯指定 quotingCase 的 letter 中文 UI 標籤「致」對應的 from 欄位覆寫值"
  - slot: Quotation
    operationId: editLetterTitle
    description: "編輯指定 quotingCase 的 letter 主旨覆寫（純文字字串；同意函上方「主旨」欄）"
  - slot: Quotation
    operationId: editLetterTo
    description: "編輯指定 quotingCase 的 letter 中文 UI 標籤「由」對應的 to 欄位覆寫值"
  - slot: Quotation
    operationId: editPaymentItemSupplementaryNoteContent
    description: "編輯指定 quotingCase 的酬金補充說明 markdown 內容"
  - slot: Quotation
    operationId: getAgreementTerms
    description: "取得 quotation 的「其它約定事項」section 內容（QCM 預設文案）"
  - slot: Quotation
    operationId: getContractNotes
    description: "取得 quotation 的 contract note 列表。不帶 quotingCaseId 為集團模式（聯集，已 dedupe），帶為 per-case 模式"
  - slot: Quotation
    operationId: getLetter
    description: "取得 letter 覆寫值（title / from / to / content）。不帶 quotingCaseId 為集團模式，帶為 per-case 模式"
  - slot: Quotation
    operationId: getPurpose
    description: "取得 quotation 的 purpose 內文（QCM 預設文案，與 case 無關）"
  - slot: Quotation
    operationId: getRightsAndObligations
    description: "取得 quotation 的「權利義務事項」section 內容（QCM 預設文案）"
  - slot: Quotation
    operationId: removeContractNoteByUser
    description: "使用者觸發的 contract note 刪除（by-trigger，對應 ContractNoteRemovedByUser）；user 一旦刪除即不可恢復"
  - slot: Quotation
    operationId: renamePaymentItem
    description: "重新命名 payment item。name 不可為空字串（aggregate guard）"
