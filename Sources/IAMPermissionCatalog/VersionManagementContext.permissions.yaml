context: VersionManagementContext
serverPrefix: /version-management-context

permissions:
  # Application credentials (IdentityContext ApplicationCredentialService through VMC). Every response that
  # carries a client secret or credential status is guarded; the other VMC routes have no permissions yet.
  - slot: Product
    operationId: getProductApplication
    description: 查看產品的 application 憑證狀態
  - slot: Product
    operationId: createProductCredential
    description: 建立產品的 application 憑證（新增產品時，有這個權限才會一併建立）
  - slot: Product
    operationId: regenerateProductCredentialSecret
    description: 重新產生產品 application 憑證的 secret
