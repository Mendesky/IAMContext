  /roles/{roleId}/remove-permissions:
    post:
      operationId: removePermissions
      description: 'TODO: describe removePermissions'
      parameters:
        - $ref: '#/components/parameters/roleId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
