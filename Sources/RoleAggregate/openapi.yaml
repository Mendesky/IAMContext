paths:
  /roles:
    post:
      operationId: createRole
      description: 'TODO: describe createRole'
      parameters:
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
