components:
  parameters:
    roleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
    operatorId:
      name: operatorId
      in: header
      required: true
      schema:
        type: string
  responses:
    NotFoundError:
      description: '404 Not Found'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/RoleApiError'
    UnprocessableEntityError:
      description: '422 Unprocessable Entity'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/RoleApiError'
    ServiceUnavailableError:
      description: '503 Service Unavailable'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/RoleApiError'
  schemas:
    RoleId:
      type: object
      required:
        - roleId
      properties:
        roleId:
          type: string
    RoleApiError:
      type: string
      enum:
        - aggregateNotFound
        - invalidPayload
        - invalidDateFormat
        - undefinedDomainError
        - serviceUnavailable
        - roleNameRequired
        - roleNameDuplicated
        - roleNameUnchanged
        - descriptionUnchanged
        - permissionsUnchanged
        - invalidPermission
    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    RenameRoleRequest:
      type: object
      required:
        - newName
      properties:
        newName:
          type: string
    UpdateRoleDescriptionRequest:
      type: object
      properties:
        newDescription:
          type: string
    RolePermissionsRequest:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
    RoleSummary:
      type: object
      required:
        - roleId
        - name
        - permissions
      properties:
        roleId:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
