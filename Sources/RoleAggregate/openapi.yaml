  /roles/{roleId}/permissions:
    get:
      operationId: getRolePermissions
      description: 'TODO: describe getRolePermissions'
      parameters:
        - $ref: '#/components/parameters/roleId'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: array
                items:
