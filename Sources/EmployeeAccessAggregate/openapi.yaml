openapi: 3.1.0
info:
  title: IAMContext EmployeeAccess API
  version: 0.1.0
paths:
  /employee-access/{employeeAccessId}/grant-privilege:
    post:
      operationId: grantPrivilege
      description: 'TODO: describe grantPrivilege'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantPrivilegeRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/revoke-privilege:
    post:
      operationId: revokePrivilege
      description: 'TODO: describe revokePrivilege'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokePrivilegeRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/change-grant-scope:
    post:
      operationId: changeGrantScope
      description: '改一個範圍化權限的授權範圍（整組換掉）。權限要是這個人直接持有、而且是範圍化的權限（權限清單上標了 grantScopeKinds）；範圍至少一項、種類要在允許清單內、內容要合法；新範圍跟現在一樣回 422 grantScopeUnchanged。同一次寫入記 PrivilegeRevoked＋帶新範圍的 PrivilegeGranted（不新增事件型別）。也用來幫「已持有、還沒有範圍」的人補範圍。'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeGrantScopeRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/assign-roles:
    post:
      operationId: assignRoles
      description: 'TODO: describe assignRoles'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolesRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/revoke-roles:
    post:
      operationId: revokeRoles
      description: 'TODO: describe revokeRoles'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRolesRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/promote-user:
    post:
      operationId: promoteUser
      description: 'TODO: describe promoteUser'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteUserRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/transfer-department:
    post:
      operationId: transferDepartment
      description: 'TODO: describe transferDepartment'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferDepartmentRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/create-user-access-profile:
    post:
      operationId: createUserAccessProfile
      description: 'TODO: describe createUserAccessProfile'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserAccessProfileRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/permissions/{userId}:
    get:
      operationId: getPermissions
      description: 'TODO: describe GetPermissions'
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/permissions/{userId}/grant-scopes:
    get:
      operationId: getPermissionGrantScopes
      description: '這個人持有的範圍化權限與各自的授權範圍（多項取聯集，由呼叫端解讀）。只列有範圍的權限；不認得的範圍種類略過那一項，一項都不剩的權限不列。ownFirm／ownDepartment 原樣回標記，由呼叫端用 StaffContext 名冊解析。尚未建檔回 404（同 getPermissions）。IAM_DEBUG_FULL_PERMISSIONS 開啟時，權限清單上每個範圍化的權限都回 company。'
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionGrantScopes'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/permission-holders:
    get:
      operationId: getPermissionHolders
      description: '反查：查詢目前持有某 permission rawValue 的所有 userId。可選 department 和/或 firm 過濾，交集篩選。無人持有時回空陣列。'
      parameters:
        - $ref: '#/components/parameters/permission'
        - $ref: '#/components/parameters/department'
        - $ref: '#/components/parameters/firm'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/role-holders:
    get:
      operationId: getRoleHolders
      description: '反查：查詢目前持有某 roleId 的所有 userId。無人持有或 role 不存在時回空陣列。'
      parameters:
        - $ref: '#/components/parameters/role'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/scope-check:
    post:
      operationId: checkScope
      description: '授權範圍判斷：回傳 userIds 之中，屬於指定 department/firm 範圍者（交集，去重，順序不保證）。department 與 firm 皆為 nil 時回傳所有存在於 IAM 的 userId。不存在於 IAM 的 userId 靜默排除，不報錯。空 userIds 回空陣列。只回傳判斷結果，不回傳部門/所別屬性——要拿來做判斷的問這裡，要拿來顯示的問 StaffContext。'
      parameters:
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckScopeRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckScopeResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/permission-holder-check:
    post:
      operationId: checkPermissionHolders
      description: '持有者判斷：回傳 userIds 之中，目前持有指定 permission 者（去重，順序不保證）。判斷規則與 getPermissionHolders 相同（逐人重播權限時間軸：被個別撤銷、或角色已移除該權限者不算持有），只是範圍限縮在給定的 userIds，不掃全體候選人。不受 IAM_DEBUG_FULL_PERMISSIONS 影響（與 getPermissionHolders 相同）。不存在於 IAM 的 userId 靜默排除，不報錯。空 userIds 回空陣列。permission 為空字串或空白回 422。'
      parameters:
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckPermissionHoldersRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckPermissionHoldersResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
components:
  parameters:
    employeeAccessId:
      name: employeeAccessId
      in: path
      required: true
      schema:
        type: string
    operatorId:
      name: operatorId
      in: header
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    permission:
      name: permission
      in: query
      required: true
      schema:
        type: string
    role:
      name: role
      in: query
      required: true
      schema:
        type: string
    department:
      name: department
      in: query
      required: false
      schema:
        type: string
    firm:
      name: firm
      in: query
      required: false
      description: '所別統一編號（統編），值域見 StaffContext Firm。IAM 不驗證傳入值是否為合法統編（錯誤值自然查無資料）。'
      schema:
        type: string
  responses:
    NotFoundError:
      description: '404 Not Found'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/EmployeeAccessApiError'
    UnprocessableEntityError:
      description: '422 Unprocessable Entity'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/EmployeeAccessApiError'
    ServiceUnavailableError:
      description: '503 Service Unavailable'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/EmployeeAccessApiError'
  schemas:
    EmployeeAccessId:
      type: object
      required:
        - employeeAccessId
      properties:
        employeeAccessId:
          type: string
    EmployeeAccessApiError:
      type: string
      enum:
        - aggregateNotFound
        - invalidPayload
        - invalidDateFormat
        - undefinedDomainError
        - serviceUnavailable
        - userIdNotExist
        - permissionNotMatch
        - employeeNotActive
        - permissionAlreadyExists
        - permissionNotExist
        - roleAlreadyExists
        - roleNotExist
        - departmentUnchanged
        - userIdMismatch
        - profileAlreadyExists
        - firmRequired
        - roleNotFound
        - grantScopeRequired
        - grantScopeKindNotAllowed
        - grantScopeNotApplicable
        - grantScopeInvalid
        - grantScopeUnchanged
        - roleContainsScopedPermission
    GrantPrivilegeRequest:
      type: object
      required:
        - userId
        - permissions
      properties:
        userId:
          type: string
        permissions:
          type: array
          items:
            type: string
        grantScopes:
          description: '範圍化權限的授權範圍（權限 → 範圍清單）。範圍化的權限（權限清單上標了 grantScopeKinds）一定要帶、至少一項；不是範圍化的權限不能帶；key 一定要在 permissions 裡。'
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/GrantScope'
    ChangeGrantScopeRequest:
      type: object
      required:
        - userId
        - permission
        - grantScopes
      properties:
        userId:
          type: string
        permission:
          type: string
        grantScopes:
          type: array
          items:
            $ref: '#/components/schemas/GrantScope'
    GrantScope:
      description: '一項授權範圍。kind：company（全公司）、firms（指定所，帶 firms：所統編清單）、departments（指定組，帶 departments：(所統編, 組名) 清單）、ownFirm（本人的所）、ownDepartment（本人的組）。company／ownFirm／ownDepartment 不帶清單。'
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
        firms:
          type: array
          items:
            type: string
        departments:
          type: array
          items:
            $ref: '#/components/schemas/GrantScopeDepartment'
    GrantScopeDepartment:
      type: object
      required:
        - firm
        - department
      properties:
        firm:
          type: string
          description: '所統編'
        department:
          type: string
          description: '組名（同一所內唯一）'
    PermissionGrantScopes:
      type: object
      required:
        - permission
        - grantScopes
      properties:
        permission:
          type: string
        grantScopes:
          type: array
          items:
            $ref: '#/components/schemas/GrantScope'
    RevokePrivilegeRequest:
      type: object
      required:
        - userId
        - permissions
      properties:
        userId:
          type: string
        permissions:
          type: array
          items:
            type: string
    AssignRolesRequest:
      type: object
      required:
        - userId
        - roles
      properties:
        userId:
          type: string
        roles:
          type: array
          items:
            type: string
    RevokeRolesRequest:
      type: object
      required:
        - userId
        - roles
      properties:
        userId:
          type: string
        roles:
          type: array
          items:
            type: string
    PromoteUserRequest:
      type: object
      required:
        - userId
        - newJobTitle
        - oldJobTitle
      properties:
        userId:
          type: string
        newJobTitle:
          type: string
        oldJobTitle:
          type: string
    TransferDepartmentRequest:
      type: object
      required:
        - userId
        - newDepartment
        - newJobTitle
      properties:
        userId:
          type: string
        newDepartment:
          type: string
        newJobTitle:
          type: string
        newFirm:
          description: '所別統一編號（統編），值域見 StaffContext Firm。'
          type: string
    CreateUserAccessProfileRequest:
      type: object
      required:
        - userId
        - department
        - jobTitle
      properties:
        userId:
          type: string
        department:
          type: string
        jobTitle:
          type: string
        firm:
          description: '所別統一編號（統編），值域見 StaffContext Firm。必填、不驗證格式。'
          type: string
    CheckScopeRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          description: '要判斷的對象，可為空陣列（回傳空 inScope，非錯誤）。'
          type: array
          items:
            type: string
        firm:
          description: '所別統一編號（統編），值域見 StaffContext Firm。nil = 不以所別限縮。'
          type: string
        department:
          description: 'nil = 不以部門限縮。'
          type: string
    CheckScopeResponse:
      type: object
      required:
        - inScope
      properties:
        inScope:
          description: 'userIds 之中，屬於該範圍者。去重，順序不保證。'
          type: array
          items:
            type: string
    CheckPermissionHoldersRequest:
      type: object
      required:
        - permission
        - userIds
      properties:
        permission:
          description: '要判斷的 permission rawValue。空字串或空白回 422。'
          type: string
        userIds:
          description: '要判斷的對象，可為空陣列（回傳空 holders，非錯誤）。'
          type: array
          items:
            type: string
    CheckPermissionHoldersResponse:
      type: object
      required:
        - holders
      properties:
        holders:
          description: 'userIds 之中，目前持有該 permission 者。去重，順序不保證。不存在於 IAM 的 userId 不會出現。'
          type: array
          items:
            type: string
