openapi: 3.1.0
info:
  title: IAMContext EmployeeAccess API
  version: 0.1.0
paths:
  /employee-access/{employeeAccessId}/grant-privilege:
    post:
      operationId: grantPrivilege
      description: 'TODO: describe grantPrivilege'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantPrivilegeRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/revoke-privilege:
    post:
      operationId: revokePrivilege
      description: 'TODO: describe revokePrivilege'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokePrivilegeRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/assign-roles:
    post:
      operationId: assignRoles
      description: 'TODO: describe assignRoles'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolesRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/revoke-roles:
    post:
      operationId: revokeRoles
      description: 'TODO: describe revokeRoles'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRolesRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/promote-user:
    post:
      operationId: promoteUser
      description: 'TODO: describe promoteUser'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteUserRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/transfer-department:
    post:
      operationId: transferDepartment
      description: 'TODO: describe transferDepartment'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferDepartmentRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/{employeeAccessId}/create-user-access-profile:
    post:
      operationId: createUserAccessProfile
      description: 'TODO: describe createUserAccessProfile'
      parameters:
        - $ref: '#/components/parameters/employeeAccessId'
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserAccessProfileRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAccessId'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/permissions/{userId}:
    get:
      operationId: getPermissions
      description: 'TODO: describe GetPermissions'
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/permission-holders:
    get:
      operationId: getPermissionHolders
      description: '反查：查詢目前持有某 permission rawValue 的所有 userId。可選 department 和/或 firm 過濾，交集篩選。無人持有時回空陣列。'
      parameters:
        - $ref: '#/components/parameters/permission'
        - $ref: '#/components/parameters/department'
        - $ref: '#/components/parameters/firm'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /employee-access/scope-check:
    post:
      operationId: checkScope
      description: '授權範圍判斷：回傳 userIds 之中，屬於指定 department/firm 範圍者（交集，去重，順序不保證）。department 與 firm 皆為 nil 時回傳所有存在於 IAM 的 userId。不存在於 IAM 的 userId 靜默排除，不報錯。空 userIds 回空陣列。只回傳判斷結果，不回傳部門/所別屬性——要拿來做判斷的問這裡，要拿來顯示的問 StaffContext。'
      parameters:
        - $ref: '#/components/parameters/operatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckScopeRequest'
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckScopeResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
components:
  parameters:
    employeeAccessId:
      name: employeeAccessId
      in: path
      required: true
      schema:
        type: string
    operatorId:
      name: operatorId
      in: header
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    permission:
      name: permission
      in: query
      required: true
      schema:
        type: string
    department:
      name: department
      in: query
      required: false
      schema:
        type: string
    firm:
      name: firm
      in: query
      required: false
      description: '所別統一編號（統編），值域見 StaffContext Firm。IAM 不驗證傳入值是否為合法統編（錯誤值自然查無資料）。'
      schema:
        type: string
  responses:
    NotFoundError:
      description: '404 Not Found'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/EmployeeAccessApiError'
    UnprocessableEntityError:
      description: '422 Unprocessable Entity'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/EmployeeAccessApiError'
    ServiceUnavailableError:
      description: '503 Service Unavailable'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                $ref: '#/components/schemas/EmployeeAccessApiError'
  schemas:
    EmployeeAccessId:
      type: object
      required:
        - employeeAccessId
      properties:
        employeeAccessId:
          type: string
    EmployeeAccessApiError:
      type: string
      enum:
        - aggregateNotFound
        - invalidPayload
        - invalidDateFormat
        - undefinedDomainError
        - serviceUnavailable
        - userIdNotExist
        - permissionNotMatch
        - employeeNotActive
        - permissionAlreadyExists
        - permissionNotExist
        - roleAlreadyExists
        - roleNotExist
        - departmentUnchanged
        - userIdMismatch
        - profileAlreadyExists
        - firmRequired
    GrantPrivilegeRequest:
      type: object
      required:
        - userId
        - permissions
      properties:
        userId:
          type: string
        permissions:
          type: array
          items:
            type: string
    RevokePrivilegeRequest:
      type: object
      required:
        - userId
        - permissions
      properties:
        userId:
          type: string
        permissions:
          type: array
          items:
            type: string
    AssignRolesRequest:
      type: object
      required:
        - userId
        - roles
      properties:
        userId:
          type: string
        roles:
          type: array
          items:
            type: string
    RevokeRolesRequest:
      type: object
      required:
        - userId
        - roles
      properties:
        userId:
          type: string
        roles:
          type: array
          items:
            type: string
    PromoteUserRequest:
      type: object
      required:
        - userId
        - newJobTitle
        - oldJobTitle
      properties:
        userId:
          type: string
        newJobTitle:
          type: string
        oldJobTitle:
          type: string
    TransferDepartmentRequest:
      type: object
      required:
        - userId
        - newDepartment
        - newJobTitle
      properties:
        userId:
          type: string
        newDepartment:
          type: string
        newJobTitle:
          type: string
        newFirm:
          description: '所別統一編號（統編），值域見 StaffContext Firm。'
          type: string
    CreateUserAccessProfileRequest:
      type: object
      required:
        - userId
        - department
        - jobTitle
      properties:
        userId:
          type: string
        department:
          type: string
        jobTitle:
          type: string
        firm:
          description: '所別統一編號（統編），值域見 StaffContext Firm。必填、不驗證格式。'
          type: string
    CheckScopeRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          description: '要判斷的對象，可為空陣列（回傳空 inScope，非錯誤）。'
          type: array
          items:
            type: string
        firm:
          description: '所別統一編號（統編），值域見 StaffContext Firm。nil = 不以所別限縮。'
          type: string
        department:
          description: 'nil = 不以部門限縮。'
          type: string
    CheckScopeResponse:
      type: object
      required:
        - inScope
      properties:
        inScope:
          description: 'userIds 之中，屬於該範圍者。去重，順序不保證。'
          type: array
          items:
            type: string
