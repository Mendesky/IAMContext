name: Release Docker Image

on:
  push:
    tags:
      - '*'

env:
  IMAGE: asia-east1-docker.pkg.dev/ai-jiabao-com/mendesky/iam-context

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # tag push 事件不帶 branch 資訊 → 驗證 tag commit 在 main 歷史上才 release
  guard:
    name: Verify tag is on main
    runs-on: [self-hosted]
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag commit is ancestor of origin/main
        id: check
        run: |
          git fetch origin main --quiet
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on-main=true"  >> "$GITHUB_OUTPUT"
          else
            echo "on-main=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build and push to Artifact Registry
    needs: guard
    if: needs.guard.outputs.on-main == 'true'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      # swift release build + docker layers 很吃磁碟；self-hosted 磁碟自管，
      # GitHub-hosted 時代的 free-disk-space 不再需要（對齊 OC release-docker.yml）
      # - name: Free up disk space
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: false
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true

      # 轉發給 Dockerfile 的 RUN --mount=type=ssh swift build
      - name: Set up SSH agent for private packages
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.RELEASE_SSH_KEY }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # latest 只在非預發布 tag(名稱不含 '-')時推,beta/dev 不蓋 latest
      - name: Docker metadata (image tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          ssh: default
          cache-from: type=gha
          cache-to: type=gha,mode=max
