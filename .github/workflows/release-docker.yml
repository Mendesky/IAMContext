name: Release Docker Image

on:
  push:
    tags:
      - '*'

env:
  IMAGE: asia-east1-docker.pkg.dev/ai-jiabao-com/mendesky/iam-context

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # tag push 事件不帶 branch 資訊 → 驗證 tag 的 commit 在 main 或某個 release/* 分支的歷史上，才 release。
  # release/* 給「從舊版開出來、只帶少數改動」的暫訂版用（例：release/1.10.x 從 1.10.0 開出、只帶權限目錄的
  # 1.11.0-beta.2）。其他分支上的 tag 一律跳過（不 build、不 push、不 red-X）。
  guard:
    name: Verify tag is on main or a release/* branch
    runs-on: [self-hosted]
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整歷史做 ancestor 判斷
      - name: Check tag commit is an ancestor of origin/main or an origin/release/* branch
        id: check
        shell: bash
        run: |
          set -euo pipefail
          # 只抓 main 和 release/*，其他分支的 ref 不在這裡出現，也就不可能被當成允許的來源。
          # --prune：上游刪掉的 release/* 分支不能因為 runner 留著舊的 remote-tracking ref 而還被當成允許的來源。
          git fetch --quiet --prune origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          # merge-base --is-ancestor：0 = 是祖先，1 = 不是，其他 = 出錯（出錯不能當成「不在分支上」而綠燈跳過）。
          is_ancestor() {
            set +e
            git merge-base --is-ancestor "$GITHUB_SHA" "$1"
            local rc=$?
            set -e
            case "$rc" in
              0) return 0 ;;
              1) return 1 ;;
              *) echo "::error::無法判斷 ${GITHUB_SHA} 是否在 $1 上（git merge-base rc=${rc}）" >&2; exit 1 ;;
            esac
          }
          if is_ancestor refs/remotes/origin/main; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${GITHUB_REF_NAME} 在 main 上，繼續 release"
            exit 0
          fi
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if is_ancestor "$ref"; then
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "✅ ${GITHUB_REF_NAME} 在 ${ref#refs/remotes/origin/} 上，繼續 release"
              exit 0
            fi
          done < <(git for-each-ref --format='%(refname)' 'refs/remotes/origin/release/')
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::${GITHUB_REF_NAME}（${GITHUB_SHA}）不在 main 或任何 release/* 分支上，跳過 release"

  build-push:
    name: Build and push to Artifact Registry
    needs: guard
    if: needs.guard.result == 'success' && needs.guard.outputs.allowed == 'true'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      # swift release build + docker layers 很吃磁碟；self-hosted 磁碟自管，
      # GitHub-hosted 時代的 free-disk-space 不再需要（對齊 OC release-docker.yml）
      # - name: Free up disk space
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: false
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true

      # 轉發給 Dockerfile 的 RUN --mount=type=ssh swift build
      - name: Set up SSH agent for private packages
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.RELEASE_SSH_KEY }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 只推 tag 名稱這一個版本號，不推 latest（部署一律用版本號）。
      # flavor latest=false：metadata-action 在某些觸發情況會自動加 latest，這裡關掉。
      - name: Docker metadata (image tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          ssh: default
          cache-from: type=gha
          cache-to: type=gha,mode=max
