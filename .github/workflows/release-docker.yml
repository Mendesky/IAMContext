name: Release Docker Image

on:
  push:
    tags:
      - '*'

env:
  IMAGE: asia-east1-docker.pkg.dev/ai-jiabao-com/mendesky/iam-context
  # 本機 layer cache（自架 runner 上的目錄，比照 AccountContext）。原本的 type=gha 依賴 GitHub 的 cache 服務：
  # 2026-11-27 GitHub 回 400「Our services aren't available right now」，image 已推好，release 仍判失敗。
  BUILDX_CACHE_DIR: /tmp/buildx-cache/iam-context

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # tag push 事件不帶 branch 資訊 → guard 判斷要不要 release（scripts/release-tag-guard.sh）：
  # tag 名稱要是版本號，tag 的 commit 要在 main 或某個 release/ 分支（release/ 底下任何名稱）的歷史上。
  # 不是版本號的 tag 跳過（不 build、不 push、不 red-X）；版本號 tag 不在這些分支上則 job 失敗。
  # release/ 分支給「從舊版開出來、只帶少數改動」的暫訂版用；這種分支上要有這個版本的 workflow 和 guard，
  # 因為 tag 觸發時跑的是 tag 那個 commit 上的檔案（更早的 commit 上的 tag 跑的仍是舊 workflow，會推 latest）。
  # guard 是發版流程的檢查，不是安全邊界（見腳本開頭）。
  guard:
    name: Verify tag is a version on main or a release/ branch
    runs-on: [self-hosted]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}   # guard 判斷的 commit，tag 之後被移動也不影響
          fetch-depth: 0           # 需要完整歷史做 ancestor 判斷
      - name: Check the tag
        id: check
        shell: bash
        run: bash scripts/release-tag-guard.sh

  build-push:
    name: Build and push to Artifact Registry
    needs: guard
    if: needs.guard.result == 'success' && needs.guard.outputs.allowed == 'true'
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}   # build guard 判斷過的同一個 commit

      # swift release build + docker layers 很吃磁碟；self-hosted 磁碟自管，
      # GitHub-hosted 時代的 free-disk-space 不再需要（對齊 OC release-docker.yml）
      # - name: Free up disk space
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: false
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true

      # 轉發給 Dockerfile 的 RUN --mount=type=ssh swift build
      - name: Set up SSH agent for private packages
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.RELEASE_SSH_KEY }}

      # 自架 runner 同一台主機上的 job 共用家目錄的 ~/.docker：setup-buildx-action 的 --use 會改掉共用的「目前 builder」，
      # 結束時 buildx rm 會停掉它建的 builder；login-action 結束時會登出共用的 config.json。
      # 2026-11-27 五個服務同時發版：AC 的 build 跑在 IdentityContext 建的 builder 上（IC 晚 2 秒 --use），
      # IC 結束時 buildx rm 停掉那個 builder，AC 正在匯出 cache，連線被切斷（graceful_stop），release 判失敗。
      # 所以每個 job 用自己的 DOCKER_CONFIG（builder 清單、目前 builder、登入憑證都在這裡面），放在 RUNNER_TEMP，
      # job 結束就清掉，憑證也不會留在共用的家目錄。之後的步驟（包括 login、buildx 的 post 清理）都讀這個值。
      # 換掉 DOCKER_CONFIG 之前先記下目前 docker context 的連線端點（DOCKER_HOST），並把家目錄的 cli-plugins 連過來：
      # 這兩樣原本也從 ~/.docker 讀，主機把 buildx 外掛裝在那裡、或 context 不是 default 時才不會壞掉。
      - name: Isolate docker config
        run: |
          host=$(docker context inspect -f '{{.Endpoints.docker.Host}}')
          if [ -z "$host" ]; then echo "::error::讀不到目前 docker context 的連線端點"; exit 1; fi
          cfg="$RUNNER_TEMP/docker-config"
          mkdir -p "$cfg"
          if [ -d "$HOME/.docker/cli-plugins" ]; then ln -sfn "$HOME/.docker/cli-plugins" "$cfg/cli-plugins"; fi
          echo "DOCKER_HOST=$host" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      # build 和 cache 匯出都明確指定這個 job 建的 builder（不靠「目前 builder」），use: false 也不去改它。
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          use: false

      # 本機 layer cache。第一次跑時 cache 還不存在，只有在有內容時才帶 cache-from
      # （對不存在的目錄下 cache-from 會讓 build 直接失敗）。
      # 寫入一律寫到 <dir>-new-<run id>：type=local 的 cache 只增不減，直接寫回同一個目錄會無限長大；
      # 加上 run id，同一個 repo 兩個 run 同時跑也不會刪掉對方寫到一半的 cache。
      - name: Prepare buildx local cache
        id: buildx-cache
        run: |
          mkdir -p "$BUILDX_CACHE_DIR"
          rm -rf "${BUILDX_CACHE_DIR}-new-${GITHUB_RUN_ID}"
          if [ -f "$BUILDX_CACHE_DIR/index.json" ]; then
            echo "from=type=local,src=$BUILDX_CACHE_DIR" >> "$GITHUB_OUTPUT"
            echo "使用既有 cache：$(du -sh "$BUILDX_CACHE_DIR" | cut -f1)"
          else
            echo "尚無 cache，這次是完整建置"
          fi

      # 只推 tag 名稱這一個版本號，不推 latest（部署一律用版本號）。
      # flavor latest=false：metadata-action 在某些觸發情況會自動加 latest，這裡關掉。
      - name: Docker metadata (image tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
          flavor: |
            latest=false

      # 推之前確認要推的 image tag 只有 tag 名稱這一個（metadata-action 的設定或版本變了也不會偷偷推 latest）。
      - name: Check image tags
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          WANT: ${{ env.IMAGE }}:${{ github.ref_name }}
        run: bash scripts/check-image-tags.sh

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          ssh: default
          cache-from: ${{ steps.buildx-cache.outputs.from }}

      # image 推完之後才匯出 build cache，獨立成一步：這一步不論怎麼失敗（cache 寫不進去、builder 連線中斷、
      # cache 服務出錯）都不會讓已經推好的 release 判失敗（continue-on-error）。
      # 同一個 builder、同樣的輸入，這次 build 全部命中剛才的結果，只做匯出；outputs type=cacheonly 不產生也不推 image。
      - name: Export build cache
        id: cache-export
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          ssh: default
          cache-from: ${{ steps.buildx-cache.outputs.from }}
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_DIR }}-new-${{ github.run_id }},mode=max,ignore-error=true

      # 新 cache 寫完整了才換上去；匯出失敗就保留舊的
      - name: Rotate buildx local cache
        if: steps.cache-export.outcome == 'success'
        run: |
          if [ -f "${BUILDX_CACHE_DIR}-new-${GITHUB_RUN_ID}/index.json" ]; then
            rm -rf "$BUILDX_CACHE_DIR"
            mv "${BUILDX_CACHE_DIR}-new-${GITHUB_RUN_ID}" "$BUILDX_CACHE_DIR"
            echo "cache 已更新：$(du -sh "$BUILDX_CACHE_DIR" | cut -f1)"
          else
            echo "這次沒有寫出新的 cache，保留舊的"
          fi

      - name: Discard partial buildx cache
        if: always()
        run: rm -rf "${BUILDX_CACHE_DIR}-new-${GITHUB_RUN_ID}"
