# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: swift build testing

on:
  pull_request:
    branches: [ "main" ]

# KurrentDB 每個 run 隨機挑一個 host port，測試端用 ESDB_TEST_URL 連上去（對齊 OC
# swift-build-testing.yaml 的做法）。先前因為測試寫死 KurrentDBClient(settings: .localhost())
# （固定 2113）而必須用 workflow 級 concurrency 把 CI 序列化，但序列化只擋得住本 repo 本
# workflow——2026-09-10 run 34434555462 就是被同一台 dev 機上「別的 runner 帳號 / 常駐
# KurrentDB」佔掉 2113 而失敗（bind: address already in use），序列化完全無效。
# 測試端加了 ESDB_TEST_URL 入口後改採隨機 port，序列化不再需要，一併移除。
#
# ⚠️ port 三邊必須對齊（照 OC 的做法，不要自己改）：
#   -p 127.0.0.1:<port>:<port>  ← host 與 container 兩端同號
#   KURRENTDB_NODE_PORT=<port>  ← DB 本身也 listen 同號
# 這樣 DB advertise 給 client 的 port 天生就等於 host port，不需要 advertise-port 變數
# （OC 實作裡並不存在 KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS 這種變數，別去猜）。

jobs:
  build:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        swift: ["6.2"]
    #runs-on: ${{ matrix.os }}
    runs-on: [self-hosted, linux, X64, dev]
    steps:
      # self-hosted runner 已預裝 Swift 工具鏈、磁碟充足：GitHub-hosted 時代的
      # setup-swift / free-disk-space 不再需要（對齊 OC swift-build-testing.yaml 的做法）
      # - uses: SwiftyLab/setup-swift@latest
      #   with:
      #      swift-version: ${{ matrix.swift }}
      - uses: actions/checkout@v4
      # KurrentDB 不再用 services:（services 不等 DB ready，self-hosted 上 job 起步快、
      # projection.sh 會搶在 DB 可用前打），改 docker run + health 輪詢 + always 停掉（對齊 OC）。
      # 隨機挑 port 的理由與「三邊對齊」規則見檔頭註解。
      - name: Start KurrentDB
        id: kdb
        run: |
          set -euo pipefail
          name="kurrentdb-iam-${{ github.run_id }}-${{ github.run_attempt }}"
          # 外層重試：挑號通過 ss 檢查後、docker bind 之前仍可能被別人搶走（TOCTOU），
          # 所以把「docker run 失敗」也當成撞號信號，整組重挑。
          for attempt in $(seq 1 5); do
            candidate=""
            for i in $(seq 1 20); do
              c=$(shuf -i 20000-60000 -n 1)
              if ! ss -tln | awk '{print $4}' | grep -q ":${c}$"; then
                candidate="$c"
                break
              fi
            done
            if [ -z "$candidate" ]; then
              echo "第 ${attempt} 次嘗試：20 次挑號皆撞號" >&2
              continue
            fi
            # ⚠️ 三邊對齊：-p 的 host/container 兩端與 KURRENTDB_NODE_PORT 必須同號（見檔頭）
            if ! docker run -d --rm --name "$name" \
              -p "127.0.0.1:${candidate}:${candidate}" \
              -e KURRENTDB_CLUSTER_SIZE=1 \
              -e KURRENTDB_RUN_PROJECTIONS=All \
              -e KURRENTDB_START_STANDARD_PROJECTIONS=true \
              -e KURRENTDB_NODE_PORT="${candidate}" \
              -e KURRENTDB_INSECURE=true \
              -e KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP=true \
              -e KURRENTDB_ADVERTISE_HOST_TO_CLIENT_AS=127.0.0.1 \
              docker.kurrent.io/kurrent-latest/kurrentdb:26.0; then
              echo "第 ${attempt} 次嘗試：docker run 失敗（port ${candidate} 可能剛被搶走）" >&2
              docker rm -f "$name" >/dev/null 2>&1 || true
              continue
            fi
            # 起得來之後的逾時屬於「DB 本身有問題」，不再重挑 port，直接紅燈並留 log
            for k in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${candidate}/health/live" || true)
              if [ "$code" = "204" ] || [ "$code" = "200" ]; then
                echo "port=${candidate}" >> "$GITHUB_OUTPUT"
                echo "KurrentDB 就緒：127.0.0.1:${candidate}"
                exit 0
              fi
              sleep 1
            done
            echo "KurrentDB 啟動逾時（port ${candidate}）" >&2
            docker logs "$name" || true
            docker stop "$name" >/dev/null 2>&1 || true
            exit 1
          done
          echo "5 次嘗試都挑不到可用 port——檢查同機是否有大量殘留容器" >&2
          exit 1
      - name: Setup projections
        env:
          KDB_PORT: ${{ steps.kdb.outputs.port }}
        run: bash ./scripts/projection.sh
      - name: Build
        run: |
          ulimit -n 10000
          swift build --build-tests --enable-code-coverage
      # ESDB_TEST_URL：測試端的 KurrentDB 連線覆寫入口（沒設就 fallback 成 .localhost() 的
      # 固定 2113，維持本機開發習慣）。scheme/帳密沿用 IAMContextServer.swift 的 ESDB_URL 格式。
      - name: Swift Testing
        env:
          ESDB_TEST_URL: kurrent://admin:changeit@localhost:${{ steps.kdb.outputs.port }}?tls=false
        run: |
          ulimit -n 10000
          swift test -v --skip-build --no-parallel --disable-xctest --enable-swift-testing
      - name: Stop KurrentDB
        if: always()
        run: docker stop "kurrentdb-iam-${{ github.run_id }}-${{ github.run_attempt }}" || true

  # ────────────────────────────────────────────────────────────
  # 通知：build 跑完後發 Teams Adaptive Card。
  #   - always()：紅 / 綠 / skip / cancelled 都通知。
  #   - 只有「失敗」時才 @tag 人；綠燈不吵人。
  #   - build 被 concurrency 取消 → 視為中性（不誤報失敗）。
  #   - 獨立 job：多一次 ~10s runner 起步，換來「彙整所有 job 結果、日後加 job 也自動涵蓋」。
  #
  # 需要的設定：
  #   secret  TEAMS_WEBHOOK_URL          — Power Automate Workflow 的觸發 URL（取代已退役的 O365 連接器）
  #   file    .github/workflows/teams-mapping.json — GitHub login → Teams 身分 的對照表（見該檔）
  #
  # tag 邏輯：成功 → tag requested_reviewers；失敗 → tag assignees（皆限 PR 事件、對照表查得到的人）。
  #   - cancelled / push 事件（無 PR context）→ 無人可 tag（正常）。
  #   - requested_reviewers 只含「尚未送出 review」的人；要含已審者可改用 reviews API（需 token，暫不加）。
  #   - 對照表查不到的 login 會被靜默略過 → 記得維護該檔。
  #   - 顯示名不對或不跳通知時，把 mapping 的 upn 換成該人的 Entra Object ID。
  # ────────────────────────────────────────────────────────────
  notify-teams:
    name: Notify Teams
    needs: [build]
    if: always()
    # label 必須與 build job 完全一致。只寫 `self-hosted` 會被派到組織裡任一台
    # self-hosted runner——2026-09-10 run 34434555462 就是被派到一台 git 設定有
    # `url.*.insteadOf` 把 HTTPS 改寫成 SSH 的機器,checkout 直接
    # `ERROR: Repository not found.` / exit 128,連 build 結果都通知不出去。
    runs-on: [self-hosted, linux, X64, dev]
    steps:
      - uses: actions/checkout@v4          # 必要！否則 runner 上沒有 .github/workflows/teams-mapping.json → 永遠 tag 不到人
      - name: Compose & send Adaptive Card
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail

          # secret 未設定 → 跳過通知（設定後自動生效），不讓 PR 因此紅燈
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "::warning::TEAMS_WEBHOOK_URL secret 未設定 — 跳過 Teams 通知"
            exit 0
          fi

          # 整體狀態
          if [ "$BUILD_RESULT" = "failure" ]; then
            overall="failure"; emoji="❌"; color="Attention"
          elif [ "$BUILD_RESULT" = "cancelled" ]; then
            overall="cancelled"; emoji="⚪"; color="Default"
          else
            overall="success"; emoji="✅"; color="Good"
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # PR 直連（PR 事件才有 .pull_request.number）→ 給 reviewer 一鍵到 PR 頁按 merge
          pr_number=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
          pr_url=""
          [ -n "$pr_number" ] && pr_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${pr_number}"

          # 分支顯示：PR 事件用來源分支名（head_ref），比 "171/merge" 好認；push 用 ref_name
          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          branch_disp="$branch_name"
          [ -n "$pr_number" ] && branch_disp="$branch_name (PR #$pr_number)"

          # 解析要 tag 的人（<at>顯示名</at> 與 entity.text 必須完全一致）
          # 成功 → requested_reviewers；失敗 → assignees。從 $GITHUB_EVENT_PATH 讀（而非 workflow 表達式內插）
          # → 避免 PR 欄位被拿來做 script injection。
          # 備註：requested_reviewers 只含「尚未送出 review」者；若要含已審者需改用 reviews API
          #       （需 permissions: pull-requests: read + GH_TOKEN），目前先不加。
          MAP_FILE=.github/workflows/teams-mapping.json
          people='[]'
          if [ -f "$MAP_FILE" ]; then
            people=$(jq -c --slurpfile map "$MAP_FILE" --arg status "$overall" '
              ($map[0] | with_entries(.key |= ascii_downcase)) as $m
              | ( if   $status == "success" then (.pull_request.requested_reviewers // [])
                  elif $status == "failure" then (.pull_request.assignees // [])
                  else [] end )
              | map(.login | ascii_downcase) | unique
              | map($m[.]) | map(select(. != null)) | unique_by(.upn)
            ' "$GITHUB_EVENT_PATH")
          fi

          # ── debug：對照表狀態 + 來源 login + mapping 結果（展開 Actions run log 這段確認）──
          echo "::group::tag 對照 debug"
          echo "event=$GITHUB_EVENT_NAME  overall=$overall"
          if [ ! -f "$MAP_FILE" ]; then
            echo "map 檔  : ✗ 不存在（$MAP_FILE 沒 commit / 路徑錯 / 或這個 job 忘了 checkout）"
          elif ! jq empty "$MAP_FILE" 2>/dev/null; then
            echo "map 檔  : ⚠️ 存在但 JSON 壞掉 → 修 JSON"
          else
            echo "map 檔  : ✓ 存在，共 $(jq 'length' "$MAP_FILE") 筆，key(小寫)= $(jq -c '[keys[]|ascii_downcase]' "$MAP_FILE")"
          fi
          echo "assignees          : $(jq -c '[(.pull_request.assignees // [])[].login]' "$GITHUB_EVENT_PATH")"
          echo "requested_reviewers: $(jq -c '[(.pull_request.requested_reviewers // [])[].login]' "$GITHUB_EVENT_PATH")"
          echo "→ 對到的人(已mapping): $people"
          echo "::endgroup::"

          entities=$(jq -nc --argjson p "$people" '
            [ $p[] | {type:"mention", text:("<at>"+.name+"</at>"),
                      mentioned:{id:.upn, name:.name}} ]')
          # 一句 call-to-action + tag：成功請 reviewer 去 merge、失敗請 assignee 去 fix
          mline=$(jq -rn --argjson p "$people" --arg status "$overall" '
            if ($p|length)==0 then ""
            else ($p | map("<at>"+.name+"</at>") | join(" ")) as $tags
              | if   $status=="success" then "✅ CI 已通過，請 reviewer 協助 merge：" + $tags
                elif $status=="failure" then "❌ CI 失敗，請 assignee 儘快 fix：" + $tags
                else $tags end
            end')

          # 用 jq 組卡片，避開手刻 JSON 的跳脫地雷
          payload=$(jq -nc \
            --arg title "$emoji CI $overall · $branch_disp" \
            --arg color "$color" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch_disp" \
            --arg br "$BUILD_RESULT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg mline "$mline" \
            --arg runurl "$run_url" \
            --arg prurl "$pr_url" \
            --argjson entities "$entities" '
            {
              type:"AdaptiveCard",
              "$schema":"http://adaptivecards.io/schemas/adaptive-card.json",
              version:"1.5",
              body: ([
                {type:"TextBlock", size:"Large", weight:"Bolder", color:$color, text:$title},
                {type:"FactSet", facts:[
                  {title:"Repo",   value:$repo},
                  {title:"Branch", value:$branch},
                  {title:"Build",  value:$br},
                  {title:"By",     value:$actor}
                ]}
              ] + (if $mline=="" then [] else [{type:"TextBlock", wrap:true, text:$mline}] end)),
              actions: (
                (if $prurl=="" then [] else [{type:"Action.OpenUrl", title:"前往 PR（可直接 merge）", url:$prurl}] end)
                + [{type:"Action.OpenUrl", title:"查看執行紀錄", url:$runurl}]
              ),
              msteams:{entities:$entities}
            }')

          curl -sSf -X POST -H "Content-Type: application/json" \
            -d "$payload" "$TEAMS_WEBHOOK_URL"
